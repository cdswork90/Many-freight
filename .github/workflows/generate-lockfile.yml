name: Generate Many Freight dependency lockfile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-lockfile.yml
      - source-preparation/package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Generate npm lockfile
        working-directory: source-preparation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile
        working-directory: source-preparation
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const p = require('./package.json');
          const l = require('./package-lock.json');
          const root = l.packages?.[''];
          const sortedEntries = (obj = {}) => Object.entries(obj).sort(([a], [b]) => a.localeCompare(b));
          assert.ok(root, 'Missing root package entry in lockfile');
          assert.equal(l.name, p.name, 'Lockfile package name differs');
          assert.equal(l.version, p.version, 'Lockfile package version differs');
          assert.deepEqual(sortedEntries(root.dependencies), sortedEntries(p.dependencies), 'Runtime dependency ranges differ');
          assert.deepEqual(sortedEntries(root.devDependencies), sortedEntries(p.devDependencies), 'Development dependency ranges differ');
          console.log('Lockfile root dependencies match package.json');
          NODE
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-preparation/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Many Freight npm dependencies"
            git push origin HEAD:main
          fi
