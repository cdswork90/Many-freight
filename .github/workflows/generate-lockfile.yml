name: Generate Many Freight dependency lockfile
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Generate npm lockfile
        working-directory: source-preparation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lockfile
        working-directory: source-preparation
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.name!==p.name || l.version!==p.version || JSON.stringify(l.packages[''].dependencies)!==JSON.stringify(p.dependencies) || JSON.stringify(l.packages[''].devDependencies)!==JSON.stringify(p.devDependencies)) process.exit(1)"
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-preparation/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Many Freight npm dependencies"
            git push origin HEAD:main
          fi
