name: Validate Many Freight source
on:
  push:
    branches: [main, many-freight-source-review, many-freight-secure-billing-recovery]
    paths:
      - source-preparation/**
      - .github/workflows/validate-source.yml
  pull_request:
    paths:
      - source-preparation/**
      - .github/workflows/validate-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-preparation
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      AUTH_SECRET: nonproduction-build-only-secret-1234567890123456
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Test paid subscription entitlements
        run: npm run test:entitlements
      - name: Build Next.js
        run: npm run build
