services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manyfreight
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  app:
    build: .
    env_file:
      - .env
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/manyfreight?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on: [db]
volumes:
  postgres_data:
